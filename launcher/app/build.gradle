plugins {
    id 'com.android.application'
}

// This fork: the launcher's versionCode, the number of commits on the branch (see defaultConfig).
def forkVersionCode() {
    def override = providers.gradleProperty('launcherVersionCode').getOrNull()
    if (override != null) return override.toInteger()
    try {
        def out = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return out.isInteger() ? Math.max(13, out.toInteger()) : 13
    } catch (Exception ignored) {
        return 13
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        // This fork: versionCode is the branch's commit count, so every build published as an update (Updates,
        // work\publish-update.ps1) is newer than the last; -PlauncherVersionCode overrides it. Upstream's 3.4
        // (versionCode 13) is the base: 13 without git. People see versionName, a plain major.minor.patch kept
        // in version.txt, which the publish script bumps for each release.
        versionCode forkVersionCode()
        versionName file('version.txt').text.trim()
        // Upstream's launcher version this fork is built on (Settings > System shows "Launcher 3.4 · Liquify's fork 0.5.8").
        // Set it to upstream's versionName when merging a new upstream release.
        resValue "string", "upstream_version", "3.4"
        // This fork: -PlauncherNetwork=offline builds the offline launcher, without the features that reach anything
        // but GitHub (weather). Themes, language downloads and updates stay; its update channel can switch builds.
        def network = providers.gradleProperty('launcherNetwork').getOrElse('online')
        if (!(network in ['online', 'offline'])) throw new GradleException("launcherNetwork must be online or offline, not $network")
        buildConfigField "boolean", "OFFLINE", (network == 'offline').toString()
        // This fork: English only in the APK. The other languages stay here as sources and download when picked
        // (LanguagePacks), which keeps about 400 KB of string tables out of every install. The offline build
        // downloads nothing, so it carries them all.
        // -PlauncherAllLanguages=true (test builds only): every language in the APK, so strings added since the last push
        // show translated before GitHub has them (a downloaded pack falls back to the APK's own strings).
        def allLanguages = providers.gradleProperty('launcherAllLanguages').getOrElse('false') == 'true'
        if (network == 'online' && !allLanguages) resourceConfigurations += ["en"]
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        buildConfig true   // BuildConfig.OFFLINE (launcherNetwork above)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// This fork: the Settings menu's Themes page. Each theme in the repo's themes/ folder that has a config.json and a
// screenshot.jpg goes into the APK's assets as themes/<name>/, with themes/index.json listing its wallpaper files.
// The wallpapers themselves stay out of the APK (about 13 MB): ThemeLibrary downloads them from GitHub on apply.
def themeAssets = layout.buildDirectory.dir('generated/themeAssets').get().asFile
android.sourceSets.main.assets.srcDirs += [themeAssets]
// This fork: a theme's screenshot only ever shows as a preview card in Settings (ThemeLibrary decodes it at 300-450 px
// wide), so the APK carries it at 640 px wide instead of the repo's 1280x720: about 2 MB less APK. themes/ is unchanged.
def shrinkScreenshot(File from, File to) {
    def img = javax.imageio.ImageIO.read(from)
    if (img == null || img.width <= 640) {
        java.nio.file.Files.copy(from.toPath(), to.toPath())
        return
    }
    int w = 640
    int h = Math.round(img.height * 640.0d / img.width) as int
    def scaled = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_RGB)
    def g = scaled.createGraphics()
    g.drawImage(img.getScaledInstance(w, h, java.awt.Image.SCALE_AREA_AVERAGING), 0, 0, null)
    g.dispose()
    def writer = javax.imageio.ImageIO.getImageWritersByFormatName('jpg').next()
    def param = writer.getDefaultWriteParam()
    param.setCompressionMode(javax.imageio.ImageWriteParam.MODE_EXPLICIT)
    param.setCompressionQuality(0.85f)
    def stream = javax.imageio.ImageIO.createImageOutputStream(to)
    try {
        writer.setOutput(stream)
        writer.write(null, new javax.imageio.IIOImage(scaled, null, null), param)
    } finally {
        stream.close()
        writer.dispose()
    }
}

tasks.register('bundleThemes') {
    def src = rootProject.file('../themes')
    inputs.dir(src)
    outputs.dir(themeAssets)
    doLast {
        themeAssets.deleteDir()
        def out = new File(themeAssets, 'themes')
        out.mkdirs()
        def index = []
        src.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { d ->
            def cfg = new File(d, 'config.json')
            def shot = new File(d, 'screenshot.jpg')
            if (!cfg.isFile() || !shot.isFile()) return
            def dst = new File(out, d.name)
            dst.mkdirs()
            java.nio.file.Files.copy(cfg.toPath(), new File(dst, 'config.json').toPath())
            shrinkScreenshot(shot, new File(dst, 'screenshot.jpg'))
            def files = []
            if (new File(d, 'wallpaper.jpg').isFile()) files << 'wallpaper.jpg'
            def walls = new File(d, 'wallpapers')
            if (walls.isDirectory()) walls.listFiles().findAll { it.isFile() }.sort { it.name }.each { files << "wallpapers/${it.name}" }
            index << [name: d.name, files: files]
        }
        new File(out, 'index.json').text = groovy.json.JsonOutput.toJson(index)
    }
}
tasks.named('preBuild') { dependsOn 'bundleThemes' }

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
